packages: []
note: >-
  Positron AI publishes no first-party client SDK. Its integration story is deliberately
  library-free: the Olivaw inference endpoint is OpenAI API-compatible, so the documented path is
  to point an existing OpenAI client at a Positron endpoint rather than install a Positron
  package. The public positron-ai GitHub org holds 14 repositories, of which 12 are forks of
  upstream ML projects (transformers, llama.cpp, gpt-oss, DeepSeek-V3, guidellm, aiperf,
  openplayground, autoagent, Defuser, cube, positron-gradio) and 2 are first-party
  (hf-litmus — continuous HuggingFace model-compatibility testing; nix-installer — a .deb build
  of the Determinate Systems Nix installer). None is a client library for the Positron APIs.
