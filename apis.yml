- name: Positron Olivaw Admin API
  description: >-
    Administrative API for the Olivaw layer that fronts Positron Atlas hardware. Manages the model catalog
    (list/create/read/update/delete), the service nodes that back it (Giskard, vLLM or OpenAI backends, with
    per-node JSON configuration and model lists), platform users, and API access tokens. Published by Positron AI
    as an OpenAPI 3.1.0 document in the public positron-ai/admin-api-docs repository; secured with a bearer
    API key.
  humanURL: https://github.com/positron-ai/admin-api-docs
  baseURL: https://api.positron.ai/
  x-baseurl-evidence: >-
    The published admin OpenAPI declares no servers[] block; the admin surface is served per deployment by the
    Olivaw appliance/cluster. api.positron.ai is Positron's live, auth-gated (401) API host as probed 2026-08-02.
  tags:
  - ai-inference
  - model-hosting
  - administration
  - access-tokens
  - llm-serving
  properties:
