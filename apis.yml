apis:
- name: Positron Olivaw OpenAI-Compatible Inference API
  description: >-
    OpenAI API-compatible inference endpoint served by Positron's Olivaw serving layer. Lists available models,
    retrieves a single model, and creates chat completions and raw text completions against models loaded onto
    Positron Atlas hardware, with optional text/event-stream streaming responses and Positron-specific selection
    settings (max_tokens, temperature, top_p, top_k). Authenticated with an API key in the authorization header.
    Because the API mirrors the OpenAI surface, existing OpenAI client libraries can be repointed at a Positron
    endpoint without code changes.
  humanURL: https://support.positron.ai/api-documentation
  baseURL: https://api.positron.ai/
  x-baseurl-evidence: >-
    api.positron.ai is live (Caddy, HTTP/2) and returns 401 Unauthorized on every probed path, including
    /openapi.json, /v1/models and /.well-known/*, so the surface is entirely auth-gated and could not be
    enumerated anonymously (probed 2026-08-02). The published OpenAPI declares a deployment-scoped server
    template `{host}/api/v1` whose default host is `http://localhost:4000` (an on-premises Atlas appliance);
    the user guide documents hosted endpoints in the form `https://<groupname>-olivaw.fly.dev`.
  tags:
  - ai-inference
  - large-language-models
  - openai-compatible
  - llm-serving
  - chat-completions
