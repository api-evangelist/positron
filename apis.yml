aid: positron
name: Positron
description: >-
  Positron AI is a US-based generative-AI hardware company founded in 2023 and headquartered in Reno, Nevada,
  building purpose-built Transformer inference accelerators as an alternative to GPU-based inference infrastructure.
  Its shipping product, Atlas, is a rack inference appliance built on eight in-house Archer accelerators (256 GB HBM)
  and dual AMD EPYC Genoa processors, with the next-generation Asimov silicon and Titan system slated for 2027.
  Positron exposes its inference fleet through "Olivaw", a serving and administration layer that publishes two
  documented HTTP APIs: an OpenAI-compatible completions API (models, chat completions, text completions, with
  server-sent-event streaming) so existing OpenAI client code can be repointed at a Positron endpoint, and an
  administrative API for managing models, service nodes, users, and access tokens on an appliance or hosted cluster.
  The company raised a $230M Series B in February 2026 at a valuation above $1B from ARENA, Jump Trading, Unless,
  the Qatar Investment Authority, Arm, Helena, DFJ Growth, Atreides, Valor, Resilience Reserve, Flume Ventures and
  1517 Fund.
